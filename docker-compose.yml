version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycoorigyn_marketing
      POSTGRES_USER: mycoorigyn
      POSTGRES_PASSWORD: mycoorigyn
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      - postgres
    environment:
      ENV: development
      PORT: "8080"
      DB_NAME: mycoorigyn_marketing
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mycoorigyn
      DB_PASSWORD: mycoorigyn
      DB_SSLMODE: disable
      PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      READ_TIMEOUT_SECONDS: "10"
      WRITE_TIMEOUT_SECONDS: "10"
      IDLE_TIMEOUT_SECONDS: "60"
      SHUTDOWN_TIMEOUT_SECONDS: "10"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
