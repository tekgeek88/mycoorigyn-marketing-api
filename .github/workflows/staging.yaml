name: Deploy marketing API staging

on:
  workflow_run:
    workflows:
      - Test and Build Go Project
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: mycoorigyn-marketing-api-staging
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    name: Build exact main and update staging GitOps
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      API_IMAGE: tekgeek88/mycoorigyn-marketing-api
      MIGRATIONS_IMAGE: tekgeek88/mycoorigyn-marketing-migrations
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_TAG: staging-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Require source to be current exact main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push exact-source staging images
        run: |
          set -euo pipefail
          docker build \
            --build-arg ENV=staging \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/tekgeek88/mycoorigyn-marketing-api" \
            --tag "$API_IMAGE:$IMAGE_TAG" \
            .
          docker push "$API_IMAGE:$IMAGE_TAG"
          docker build \
            --file Dockerfile.migrations \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/tekgeek88/mycoorigyn-marketing-api" \
            --tag "$MIGRATIONS_IMAGE:$IMAGE_TAG" \
            .
          docker push "$MIGRATIONS_IMAGE:$IMAGE_TAG"

      - name: Update staging GitOps only
        env:
          GITOPS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git config --global user.name github-actions
          git config --global user.email actions@github.com
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/tekgeek88/argocd-apps.git" "$RUNNER_TEMP/argocd-apps"
          node scripts/update-staging-gitops.mjs "$RUNNER_TEMP/argocd-apps" "$SOURCE_SHA" "$IMAGE_TAG"
          cd "$RUNNER_TEMP/argocd-apps"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              apps/applications/mycoorigyn-marketing-api-staging.yaml|\
              apps/mycoorigyn/api/overlays/staging/deployment.yaml|\
              apps/mycoorigyn/api/overlays/staging/kustomization.yaml|\
              apps/mycoorigyn/api/overlays/staging/migrations/db-migrate-job.yaml)
                ;;
              *)
                echo "Refusing unexpected GitOps change: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --check
          git add -- "${changed[@]}"
          git commit -m "Deploy marketing API staging ${SOURCE_SHA}"
          git push origin main
