name: Release api

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IMAGE_NAME: tekgeek88/mycoorigyn-marketing-api
      MIGRATIONS_IMAGE_NAME: tekgeek88/mycoorigyn-marketing-migrations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build --build-arg ENV=production -t "$IMAGE_NAME:$VERSION" .
          docker push "$IMAGE_NAME:$VERSION"
          echo "Pushed docker image: $IMAGE_NAME:$VERSION"

      - name: Build and Push Migration Image
        run: |
          docker build -f Dockerfile.migrations -t "$MIGRATIONS_IMAGE_NAME:$VERSION" .
          docker push "$MIGRATIONS_IMAGE_NAME:$VERSION"
          echo "Pushed docker image: $MIGRATIONS_IMAGE_NAME:$VERSION"

      - name: Update ArgoCD GitOps Repo (Production)
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/tekgeek88/argocd-apps.git"
          REPO_NAME="argocd-apps"
          VERSION_TAG="${{ env.VERSION }}"
          TIMESTAMP=$(date +%s)
          REPO_PATH="$GITHUB_WORKSPACE/$REPO_NAME"
          APP_PATH="$REPO_PATH/apps/mycoorigyn/api"
          DEPLOYMENT_FILE="$APP_PATH/base/deployment.yaml"
          PRODUCTION_KUSTOMIZATION="$APP_PATH/overlays/production/kustomization.yaml"
          MIGRATION_JOB_FILE="$APP_PATH/overlays/production/migrations/db-migrate-job.yaml"

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git clone "$REPO_URL" "$REPO_PATH"

          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "Missing deployment file: $DEPLOYMENT_FILE"
            exit 1
          fi

          if [ ! -f "$PRODUCTION_KUSTOMIZATION" ]; then
            echo "Missing production kustomization: $PRODUCTION_KUSTOMIZATION"
            exit 1
          fi

          if [ ! -f "$MIGRATION_JOB_FILE" ]; then
            echo "Missing migration job file: $MIGRATION_JOB_FILE"
            exit 1
          fi

          sed -i "s/last-update: \".*\"/last-update: \"$TIMESTAMP\"/" "$DEPLOYMENT_FILE"

          sed -i "/name: tekgeek88\/mycoorigyn-marketing-api/{n;s/newName: .*/newName: tekgeek88\/mycoorigyn-marketing-api/;n;s/newTag: .*/newTag: $VERSION_TAG/;}" "$PRODUCTION_KUSTOMIZATION"
          sed -i "/name: tekgeek88\/mycoorigyn-marketing-migrations/{n;s/newName: .*/newName: tekgeek88\/mycoorigyn-marketing-migrations/;n;s/newTag: .*/newTag: $VERSION_TAG/;}" "$PRODUCTION_KUSTOMIZATION"

          sed -i "s|^\( *image: \).*|\1$MIGRATIONS_IMAGE_NAME:$VERSION_TAG|" "$MIGRATION_JOB_FILE"
          sed -i "s|^  name: mycoorigyn-db-migrate-.*$|  name: mycoorigyn-db-migrate-$VERSION_TAG|" "$MIGRATION_JOB_FILE"

          cd "$REPO_PATH"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update mycoorigyn api production image to $VERSION_TAG"
            git push origin main
            echo "Changes committed and pushed."
          else
            echo "No changes to commit."
          fi

          echo "Deploying version: $VERSION_TAG"
