name: Publish marketing release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build and publish immutable artifact metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      API_IMAGE: tekgeek88/mycoorigyn-marketing-api
      MIGRATIONS_IMAGE: tekgeek88/mycoorigyn-marketing-migrations

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4

      - name: Validate release and migration identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must be an exact semantic version (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          }
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          mapfile -t up_files < <(find migrations -maxdepth 1 -type f -name '*.up.sql' -print | LC_ALL=C sort)
          mapfile -t down_files < <(find migrations -maxdepth 1 -type f -name '*.down.sql' -print | LC_ALL=C sort)
          [[ "${#up_files[@]}" -gt 0 && "${#up_files[@]}" -eq "${#down_files[@]}" ]] || {
            echo 'Migration up/down inventory is incomplete.' >&2
            exit 1
          }
          for up_file in "${up_files[@]}"; do
            [[ -f "${up_file%.up.sql}.down.sql" ]] || {
              echo "Missing down migration for $up_file" >&2
              exit 1
            }
          done
          migration_sha=$(find migrations -maxdepth 1 -type f -name '*.sql' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          [[ "$migration_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'version=%s\nsource_sha=%s\nmigration_pairs=%s\nmigration_sha=%s\n' \
            "$version" "$source_sha" "${#up_files[@]}" "$migration_sha" >>"$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push versioned API and migration images
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          docker build --build-arg ENV=production --tag "$API_IMAGE:$VERSION" .
          docker push "$API_IMAGE:$VERSION"
          docker build --file Dockerfile.migrations --tag "$MIGRATIONS_IMAGE:$VERSION" .
          docker push "$MIGRATIONS_IMAGE:$VERSION"

      - name: Resolve immutable digests and write release metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          MIGRATION_PAIRS: ${{ steps.identity.outputs.migration_pairs }}
          MIGRATION_SHA: ${{ steps.identity.outputs.migration_sha }}
        run: |
          set -euo pipefail
          api_manifest=$(docker buildx imagetools inspect "$API_IMAGE:$VERSION" --format '{{json .Manifest}}')
          migrations_manifest=$(docker buildx imagetools inspect "$MIGRATIONS_IMAGE:$VERSION" --format '{{json .Manifest}}')
          api_digest=$(jq -er '.digest // .Digest' <<<"$api_manifest")
          migrations_digest=$(jq -er '.digest // .Digest' <<<"$migrations_manifest")
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$migrations_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg publishedAt "$published_at" \
            --arg apiRepository "$API_IMAGE" \
            --arg apiDigest "$api_digest" \
            --arg migrationsRepository "$MIGRATIONS_IMAGE" \
            --arg migrationsDigest "$migrations_digest" \
            --arg migrationInventorySha256 "sha256:$MIGRATION_SHA" \
            --argjson migrationPairs "$MIGRATION_PAIRS" \
            '{schemaVersion:1,component:"marketing",version:$version,sourceSha:$sourceSha,publishedAt:$publishedAt,migrations:{pairCount:$migrationPairs,inventorySha256:$migrationInventorySha256,check:"passed"},images:{api:{repository:$apiRepository,digest:$apiDigest,immutableRef:($apiRepository+"@"+$apiDigest)},migrations:{repository:$migrationsRepository,digest:$migrationsDigest,immutableRef:($migrationsRepository+"@"+$migrationsDigest)}}}' \
            >release-metadata.json
          printf 'api_digest=%s\nmigrations_digest=%s\n' "$api_digest" "$migrations_digest" >>"$GITHUB_OUTPUT"

      - name: Upload machine-readable release metadata
        uses: actions/upload-artifact@v4
        with:
          name: marketing-${{ steps.identity.outputs.version }}-release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize published artifacts
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          API_DIGEST: ${{ steps.metadata.outputs.api_digest }}
          MIGRATIONS_DIGEST: ${{ steps.metadata.outputs.migrations_digest }}
          MIGRATION_PAIRS: ${{ steps.identity.outputs.migration_pairs }}
          MIGRATION_SHA: ${{ steps.identity.outputs.migration_sha }}
        run: |
          {
            echo '## MycoOrigyn marketing artifacts published'
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- API image: \`$API_IMAGE@$API_DIGEST\`"
            echo "- Migrations image: \`$MIGRATIONS_IMAGE@$MIGRATIONS_DIGEST\`"
            echo "- Migration inventory: \`$MIGRATION_PAIRS pairs / sha256:$MIGRATION_SHA\`"
            echo '- Migration execution: **none**'
            echo '- Production GitOps mutation: **none**'
            echo '- Promotion requires a separately reviewed and owner-authorized argocd-apps plan.'
          } >>"$GITHUB_STEP_SUMMARY"
